# Builds the Linux bundles (AppImage, deb, rpm) on ubuntu-22.04 — the oldest
# supported distro (glibc 2.35, WebKitGTK 4.1) — and uploads them as artifacts,
# so the install checklist (plans/checklists/L11.md) can run on real VMs. The full
# tagged-release matrix lives in release.yml.
name: linux-build

on:
  workflow_dispatch:
  push:
    branches: [port/multi-os]
    paths:
      - "native/**"
      - ".github/workflows/linux-build.yml"

defaults:
  run:
    working-directory: native

jobs:
  bundle:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config curl wget file libssl-dev libdbus-1-dev \
            libgtk-3-dev libwebkit2gtk-4.1-dev libxdo-dev \
            libayatana-appindicator3-dev librsvg2-dev \
            libpipewire-0.3-dev libva-dev libxkbcommon-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
      - name: Install the Tauri CLI
        run: cargo install tauri-cli --version '^2' --locked
      - name: Bundle
        # APPIMAGE_EXTRACT_AND_RUN: the runner has no FUSE for the AppImage tooling.
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        working-directory: native/app
        run: cargo tauri build --bundles appimage,deb,rpm
      - name: Package contents
        run: |
          dpkg-deb --info target/release/bundle/deb/*.deb
          dpkg-deb --contents target/release/bundle/deb/*.deb
      - uses: actions/upload-artifact@v4
        with:
          name: sharectrl-linux
          if-no-files-found: error
          path: |
            native/target/release/bundle/appimage/*.AppImage
            native/target/release/bundle/deb/*.deb
            native/target/release/bundle/rpm/*.rpm
