# CI for the native Rust app: format, lint, build and test on every shipped OS,
# plus the license gate. `cargo-deny` enforces the allowlist / banned-crate list
# for every target triple (see native/deny.toml) — the piece that keeps the
# product proprietary and legal. The loopback test runs a full two-engine session
# over real WebRTC with mock OS backends, so it needs no GPU, display or
# permissions on the runners.
name: native-ci

on:
  push:
    paths:
      - "native/**"
      - ".github/workflows/native-ci.yml"
  pull_request:
    paths:
      - "native/**"
      - ".github/workflows/native-ci.yml"

defaults:
  run:
    working-directory: native

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-22.04: the oldest supported Linux (glibc 2.35, WebKitGTK 4.1).
        os: [windows-latest, macos-latest, ubuntu-22.04]
        # Cross-codec matrix (task I5, crates/codec-goldens): the codec
        # backends each runner is known to have, so their golden-stream and
        # encoder-shape tests fail instead of skipping when absent
        # (SCT_CODEC_TESTS_REQUIRED, comma list of backend names).
        # * windows-latest: OpenH264 (Cisco download; runners have network).
        #   The Media Foundation rows (MF H.264 decoder, MF encoder shape)
        #   skip when the MFTs are absent and run (and must pass) when
        #   present; they are not required yet because no run has proven the
        #   runner image has Microsoft's H.264 MFTs (Windows Server ships them
        #   only with the Media Foundation feature). On a GPU-less runner they
        #   use a WARP D3D11 device, a path machine A (which has a GPU) never
        #   exercised; the first pushed run checks it. Once a run's log shows
        #   `matrix: media-foundation × … PASS`, make this
        #   `openh264,media-foundation` (plans/checklists/I5.md).
        # * ubuntu-22.04: OpenH264. No GPU, so NVENC/NVDEC print SKIP and the
        #   VA-API decode is device-only (#[ignore]); the device-free VA-API
        #   planner still runs every H.264 golden.
        # * macos-latest: none here; the VideoToolbox step below (task T2)
        #   has its own strict-mode switch.
        include:
          - os: windows-latest
            codec_required: openh264
          - os: ubuntu-22.04
            codec_required: openh264
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # mesa-vulkan-drivers: lavapipe (software Vulkan) for the headless
      # presenter-shader tests in surface-wgpu; the runner has no GPU.
      # libpipewire-0.3-dev / libspa-0.2-dev / libclang-dev: the Wayland capture's
      # pipewire-rs bindings (bindgen needs libclang).
      - name: Linux build dependencies (Tauri / WebKitGTK, PipeWire, software Vulkan)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev libdbus-1-dev libgtk-3-dev \
            libwebkit2gtk-4.1-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev \
            libpipewire-0.3-dev libspa-0.2-dev libclang-dev \
            mesa-vulkan-drivers
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
      - name: Format check
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        env:
          SCT_CODEC_TESTS_REQUIRED: ${{ matrix.codec_required }}
        run: cargo test --workspace
      # VideoToolbox hardware tests (plan task T2). Each test probes first and
      # skips when VideoToolbox has no hardware for it; a skip is a printed line
      # and a workflow warning annotation, not a pass. Whether a hosted macOS
      # runner has the hardware is unproven until a run shows it: GitHub's arm64
      # macOS images run inside Apple's Virtualization framework, and nothing in
      # the runner-images docs promises a hardware VideoToolbox there (the README
      # only says `macos-latest` = macOS 26 arm64). So the strict mode
      # (SCT_MAC_HW_TESTS_REQUIRED) is opt-in through a repository variable, not
      # set here: enable it after a run proves the hardware is present. The two
      # timing tests are device-only (a loaded shared runner cannot hold a
      # wall-clock budget) and skipped by name here. The golden-stream test
      # checks VideoToolbox's output against FFmpeg's per-frame hashes
      # (native/testdata/golden/README.md). --nocapture keeps the printed dB /
      # frame lines in the log.
      - name: VideoToolbox hardware tests (macOS)
        if: runner.os == 'macOS'
        env:
          SCT_MAC_HW_TESTS_REQUIRED: ${{ vars.SCT_MAC_HW_TESTS_REQUIRED }}
        run: |
          cargo test -p platform-macos --lib vt_encoder::tests -- --ignored --nocapture
          cargo test -p platform-macos --lib decode:: -- --ignored --nocapture
          cargo test -p platform-macos --test vt_encode -- --ignored --nocapture --test-threads=1 \
            --skip encodes_300_frames_first_idr_mean_under_8ms \
            --skip holds_the_bitrate_within_15_percent_over_5_seconds

  # The X11 tests with their skips turned into failures (plan task T3). Runs on
  # ubuntu-22.04, the same image as build-test's Linux leg, the oldest supported
  # Linux (decision 7). The job
  # never starts a global Xvfb: each test starts its own private server through
  # native/crates/platform-linux/tests/support/xserver.rs (Xvfb, and Xephyr for
  # the resize test) on a display number of its own, reached over the Unix
  # socket. Packages: `xvfb` and `xserver-xephyr` (Xvfb(1) and Xephyr(1) man
  # pages; `-displayfd` is the readiness signal), `x11-xserver-utils` (xrandr),
  # `xterm` (the moving window of the L2 damage test), `xclip` (clipboard
  # tests), `xdotool` (L6's XTest check reads window names with it; no current
  # test calls it yet).
  # build-test's Linux leg runs the same tests WITHOUT SCT_X11_TESTS_REQUIRED,
  # so a tool it lacks is a printed skip there; this job is the one that forbids
  # skips.
  x11-tests:
    runs-on: ubuntu-22.04
    env:
      # Any skip in the X11 tests becomes a panic (support/xserver.rs skip()).
      SCT_X11_TESTS_REQUIRED: "1"
      # Uinput read-back (L6) and the input peers it needs: a missing /dev/uinput,
      # evdev node or sway becomes a panic (src/input/tests.rs skip_input()).
      SCT_LINUX_INPUT_TESTS_REQUIRED: "1"
      # Software GL for the wgpu presenter in x11_surface: Mesa llvmpipe through
      # LIBGL_ALWAYS_SOFTWARE, because GitHub's Linux runners have no GPU.
      # x11_surface also sets it itself.
      LIBGL_ALWAYS_SOFTWARE: "1"
    steps:
      - uses: actions/checkout@v4
      # The Linux build dependencies of build-test (same list, kept in step),
      # plus the X11 test packages. The 22.04 runner image already ships xvfb
      # (runner-images Ubuntu2204-Readme: xvfb 2:21.1.4-2ubuntu1.7~22.04.16);
      # naming it here keeps the job independent of the image's contents.
      # xserver-xephyr: packages.ubuntu.com, jammy, 2:21.1.4-2ubuntu1.7~22.04.16.
      - name: Linux build and X11 test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev libdbus-1-dev libgtk-3-dev \
            libwebkit2gtk-4.1-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev \
            libpipewire-0.3-dev libspa-0.2-dev libclang-dev \
            mesa-vulkan-drivers \
            xvfb xserver-xephyr x11-xserver-utils xterm xclip xdotool acl
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
      # Each step uses --nocapture so the harness's "private Xvfb on :N" and
      # "skipping:" lines reach the log.
      - name: X11 capture (L2: Xvfb, Xephyr for the resize test)
        run: cargo test -p platform-linux --test x11_capture -- --nocapture
      - name: X11 video surface (L5: Xvfb, software GL, GL pass re-run)
        run: cargo test -p platform-linux --test x11_surface -- --nocapture
      - name: Clipboard (L8: private Xvfb, xclip)
        run: cargo test -p platform-linux --lib clipboard::tests -- --nocapture
      - name: Shortcut hook (L7: private Xvfb, XI2 grab, XTEST keys)
        run: cargo test -p platform-linux --lib shortcuts::xvfb_tests -- --nocapture
      # L6 (plan 05): the XTest injector against a private Xvfb, then the uinput
      # read-back. Two filters, not `input::tests`: that module also holds the
      # libei test (T4's EIS peer) and the wlroots test (needs sway, which this
      # job does not install); with SCT_LINUX_INPUT_TESTS_REQUIRED=1 the wlroots
      # test would fail here by design. The pure front-end tests run in
      # build-test's workspace leg.
      #
      # uinput needs /dev/uinput writable and the /dev/input/event* nodes the test
      # creates readable by the runner user. Group membership is not used: a
      # `usermod -aG input` run inside the job does not reach the job's already
      # started steps without a new login, so it would not be in effect. Instead:
      # - modprobe uinput loads the module, which creates /dev/uinput (the L6
      #   note says the runner kernel has evdev and uinput);
      # - setfacl grants the runner user rw on /dev/uinput (acl package above);
      # - a udev rule (udev(7): KERNEL and MODE keys) gives the event nodes
      #   mode 0666 when the test creates them. The test waits up to 5 s for
      #   each node (eventually() in input/tests.rs), which covers udev's
      #   asynchronous processing.
      # The runner is a throwaway VM (GitHub-hosted runner reference: passwordless
      # sudo, a new VM per runner), so the permissive mode does not outlive the job.
      - name: uinput access for the runner user (L6 read-back)
        run: |
          sudo modprobe uinput
          sudo setfacl -m "u:$(id -un):rw" /dev/uinput
          echo 'KERNEL=="event*", SUBSYSTEM=="input", MODE="0666"' | sudo tee /etc/udev/rules.d/90-sharectrl-ci-input.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --subsystem-match=input
      - name: XTest injector (L6: private Xvfb)
        run: cargo test -p platform-linux --lib input::tests::xtest -- --nocapture
      - name: uinput read-back through evdev (L6)
        run: cargo test -p platform-linux --lib input::tests::uinput -- --nocapture

  release-build:
    # The optimized Windows build the dev/test pipelines ship.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
      - name: Build (release)
        run: cargo build --workspace --release

  license-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Prebuilt binary — no 8-minute source compile.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: cargo-deny (license + banned-crate enforcement, all targets)
        run: cargo deny check
