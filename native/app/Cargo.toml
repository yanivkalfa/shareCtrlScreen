[package]
name = "app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "sharectrl"
path = "src/main.rs"

[lints]
workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
engine = { path = "../crates/engine" }
protocol = { path = "../crates/protocol" }
tauri = { version = "2", features = [] }
# In-app updater (task U1). Pinned to the versions verified in
# plans/06-CRATES-AND-LICENSES.md; both are desktop-only and the app is
# desktop-only. tauri-plugin-process backs the webview relaunch the updater uses.
tauri-plugin-updater = "2.14.1"
tauri-plugin-process = "2.4.0"
# Opens the releases page in the system browser for a non-self-updatable Linux
# .deb/.rpm install (task U3). Smallest reliable cross-platform opener; MIT
# (already in the deny/about allow-lists). `that_detached` does not wait on the
# browser process.
open = "5"
serde = { workspace = true }
serde_json.workspace = true
tokio = { workspace = true }
tracing.workspace = true
tracing-subscriber.workspace = true
platform-api = { path = "../crates/platform-api" }
codec-openh264 = { path = "../crates/codec-openh264" }
raw-window-handle = "0.6"

[dev-dependencies]
# The mock platform lets the permission commands be tested with scripted states.
platform-api = { path = "../crates/platform-api", features = ["mock"] }

[target.'cfg(windows)'.dependencies]
platform-windows = { path = "../crates/platform-windows" }
# The UIAccess token query for the startup line and `--print-uiaccess` (W5).
elevation = { path = "../crates/elevation" }

[target.'cfg(target_os = "macos")'.dependencies]
platform-macos = { path = "../crates/platform-macos" }

[target.'cfg(target_os = "linux")'.dependencies]
platform-linux = { path = "../crates/platform-linux" }
