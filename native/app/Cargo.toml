[package]
name = "app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "sharectrl"
path = "src/main.rs"

[lints]
workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
engine = { path = "../crates/engine" }
protocol = { path = "../crates/protocol" }
tauri = { version = "2", features = [] }
serde = { workspace = true }
serde_json.workspace = true
tokio = { workspace = true }
tracing.workspace = true
tracing-subscriber.workspace = true
platform-api = { path = "../crates/platform-api" }
codec-openh264 = { path = "../crates/codec-openh264" }
raw-window-handle = "0.6"

[dev-dependencies]
# The mock platform lets the permission commands be tested with scripted states.
platform-api = { path = "../crates/platform-api", features = ["mock"] }

[target.'cfg(windows)'.dependencies]
platform-windows = { path = "../crates/platform-windows" }

[target.'cfg(target_os = "macos")'.dependencies]
platform-macos = { path = "../crates/platform-macos" }

[target.'cfg(target_os = "linux")'.dependencies]
platform-linux = { path = "../crates/platform-linux" }
