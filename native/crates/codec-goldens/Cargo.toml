[package]
name = "codec-goldens"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

# Dev-only (task I5): the golden encoder outputs in `native/testdata/golden`,
# the decoder matrix every decoder crate runs against them, and the
# encoder-output shape check. Only ever a `[dev-dependencies]` entry — no
# shipped crate depends on it. Pure Rust, every OS.
[dependencies]
platform-api = { path = "../platform-api" }
# Per-frame SHA-256 of decoded pictures, compared with FFmpeg's `framehash`.
# Both are workspace dependencies already (plans/06).
sha2.workspace = true
hex.workspace = true

[dev-dependencies]
platform-api = { path = "../platform-api", features = ["mock"] }
