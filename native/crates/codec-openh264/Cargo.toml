[package]
name = "codec-openh264"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

# Software H.264 on every OS (plan 04 §5, decision #1): Cisco's prebuilt
# OpenH264 binary, downloaded from Cisco at first use and loaded at runtime.
#
# `default-features = false` is a licence condition, not a size optimisation:
# the crates' default `source` feature compiles OpenH264 into our binary, which
# Cisco's patent coverage does not extend to. Only `libloading` is allowed.
[dependencies]
platform-api = { path = "../platform-api" }
openh264 = { version = "0.9.9", default-features = false, features = ["libloading"] }
openh264-sys2 = { version = "0.9.9", default-features = false, features = ["libloading"] }
thiserror.workspace = true
tracing.workspace = true
sha2.workspace = true
hex.workspace = true
# Pure-Rust bzip2 *decoder* (Cisco serves `.bz2`); avoids the C libbz2 and its
# non-SPDX-standard licence.
bzip2-rs = "0.1.2"

# Blocking HTTPS for the one-off download; no gzip (the payload is already
# bzip2). Windows/Linux: rustls + webpki roots, already in the tree via
# tokio-tungstenite. macOS: the system TLS (Security.framework through
# native-tls) and the system trust store — no C build step, so the macOS
# backend still cross-checks from Windows, and corporate roots configured in
# Keychain are honoured.
[target.'cfg(not(target_os = "macos"))'.dependencies]
ureq = { version = "3.5", default-features = false, features = ["rustls"] }

[target.'cfg(target_os = "macos")'.dependencies]
ureq = { version = "3.5", default-features = false, features = ["native-tls-no-default"] }

[dev-dependencies]
platform-api = { path = "../platform-api", features = ["mock"] }
# The golden streams, decoder matrix and encoder shape check (task I5).
codec-goldens = { path = "../codec-goldens" }
