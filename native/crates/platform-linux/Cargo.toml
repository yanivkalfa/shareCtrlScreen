[package]
name = "platform-linux"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Hardware encoders (task L3). Both are loaded with dlopen at run time — nothing
# is linked and no SDK or headers are needed to build — so enabling them never
# stops the app starting on a machine without the libraries: the probe simply
# reports them absent.
default = ["vaapi", "nvenc"]
# Intel / AMD (any VA-API driver): libva.so.2 + libva-drm.so.2.
vaapi = []
# NVIDIA: libnvidia-encode.so.1 + libcuda.so.1 from the proprietary driver.
nvenc = []

# Linux implementation of `platform-api` (plan lane L). Empty on other targets.
[target.'cfg(target_os = "linux")'.dependencies]
platform-api = { path = "../platform-api" }
codec-openh264 = { path = "../codec-openh264" }
tracing.workspace = true
dirs = "6"
# Secret Service (org.freedesktop.secrets) for saved passwords. The store is built
# per call rather than through the keyring crate's v1 layer, which caches its first
# initialisation result for the process (see src/secret.rs). Pure Rust over zbus,
# so no libdbus-1-dev is needed at build time.
keyring-core = "1"
zbus-secret-service-keyring-store = { version = "1", features = ["rt-async-io-crypto-rust"] }
uuid.workspace = true
# Portal D-Bus client. No `pipewire` feature: it pins an older pipewire-rs than the
# capture task (L1) uses and the permission flow only needs the D-Bus half.
ashpd = { version = "0.13.13", default-features = false, features = ["tokio", "screencast", "remote_desktop"] }
tokio = { workspace = true }
# ISC. dlopen/dlsym: the permissions preflight's libva probe and the VA-API /
# NVENC / CUDA runtime bindings (decision #7: libva is dlopen'd, never linked).
# Always on because the preflight needs it whatever the encoder features.
libloading = "0.8"
# Clipboard text (X11 + Wayland). No `image-data`: images are out of scope and the
# default feature drags in the `image` decoder stack.
arboard = { version = "3.6", default-features = false, features = ["wayland-data-control"] }
# X11 selection owner for file lists and X11 screen capture (pure-Rust
# connection, no libxcb). Capture (task L2) uses MIT-SHM, DAMAGE, XFixes and
# RandR; `damage` implies `xfixes`, `randr` implies `render`.
x11rb = { version = "0.14", features = ["shm", "damage", "xfixes", "randr"] }
# Wayland selection owner for file lists (data-control protocols).
wl-clipboard-rs = "0.9"

[target.'cfg(target_os = "linux")'.dev-dependencies]
tempfile = "3"
# Reads the daemon's items directly in tests/secret_daemon.rs. Same zbus runtime
# (async-io) as the store, so the test exercises the production runtime.
secret-service = { version = "5", features = ["rt-async-io-crypto-rust"] }
