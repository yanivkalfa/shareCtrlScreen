[package]
name = "platform-macos"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

# macOS implementation of `platform-api` (plan lane M). Empty on other targets.
[target.'cfg(target_os = "macos")'.dependencies]
platform-api = { path = "../platform-api" }
tracing.workspace = true
dirs = "6"
objc2 = "0.6"
# Completion handlers and the capture delivery queue (task M1).
block2 = "0.6"
dispatch2 = "0.3"
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSArray",
    "NSDictionary",
    "NSEnumerator",
    "NSError",
    "NSGeometry",
    "NSString",
    "NSURL",
    "NSValue",
    "objc2-core-foundation",
] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSCursor",
    "NSEvent",
    "NSGraphicsContext",
    "NSImage",
    "NSImageRep",
    "NSPasteboard",
    "NSWorkspace",
    "objc2-core-foundation",
    "objc2-core-graphics",
] }
# TCC permission probes and requests (task M11); `plans/06-CRATES-AND-LICENSES.md`.
objc2-core-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "CFArray",
    "CFCGTypes",
    "CFDictionary",
    "CFNumber",
    "CFString",
] }
objc2-core-graphics = { version = "0.3", default-features = false, features = [
    "std",
    "CGBitmapContext",
    "CGColorSpace",
    "CGContext",
    "CGDirectDisplay",
    "CGDisplayConfiguration",
    "CGDisplayStream",
    "CGError",
    "CGEvent",
    "CGGeometry",
    "CGImage",
    "CGWindow",
    "libc",
] }
objc2-application-services = { version = "0.3", default-features = false, features = ["std", "HIServices", "AXUIElement"] }
# Keychain (generic passwords). keyring 4.2 has no `macos` feature: the Keychain
# store is selected by its default `v1` feature on macOS.
keyring = "4.2"
uuid.workspace = true
# ScreenCaptureKit capture (task M1). Only the stream API: the defaults also
# pull in AVFoundation (recording output) and the content-sharing picker.
objc2-core-media = { version = "0.3", default-features = false, features = [
    "std",
    "CMSampleBuffer",
    "CMTime",
    "objc2-core-video",
] }
objc2-core-video = { version = "0.3", default-features = false, features = [
    "std",
    "CVBuffer",
    "CVImageBuffer",
    "CVPixelBuffer",
] }
objc2-screen-capture-kit = { version = "0.3", default-features = false, features = [
    "std",
    "SCError",
    "SCShareableContent",
    "SCStream",
    "block2",
    "dispatch2",
    "objc2-core-foundation",
    "objc2-core-graphics",
    "objc2-core-media",
] }

# The device smoke test (tests/sck_smoke.rs) logs through tracing and measures
# process CPU time with getrusage.
[target.'cfg(target_os = "macos")'.dev-dependencies]
tracing-subscriber.workspace = true
libc = "0.2"
