[package]
name = "platform-macos"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

# macOS implementation of `platform-api` (plan lane M). Not target-gated, so the
# pure plist logic in `autostart.rs` compiles and tests on every OS.
[dependencies]
platform-api = { path = "../platform-api" }
tracing.workspace = true
dirs = "6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSString", "NSURL"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSPasteboard"] }
