[package]
name = "platform-macos"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

# macOS implementation of `platform-api` (plan lane M). Empty on other targets.
[target.'cfg(target_os = "macos")'.dependencies]
platform-api = { path = "../platform-api" }
# `InputMsg` / `Button`, the wire types the injector (task M5) consumes.
protocol = { path = "../protocol" }
codec-openh264 = { path = "../codec-openh264" }
tracing.workspace = true
dirs = "6"

objc2 = "0.6"
# Completion handlers and the capture delivery queue (task M1).
block2 = "0.6"
dispatch2 = "0.3"
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSArray",
    "NSDictionary",
    "NSEnumerator",
    "NSError",
    "NSGeometry",
    # Window-resign-key observer of the video view (task M4).
    "NSNotification",
    "NSString",
    "NSURL",
    "NSValue",
    "objc2-core-foundation",
] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSCursor",
    "NSEvent",
    "NSGraphicsContext",
    "NSImage",
    "NSImageRep",
    "NSPasteboard",
    # Input injection (task M5): app activation for `focus_window_at`.
    "NSRunningApplication",
    "libc",
    "NSWorkspace",
    "objc2-core-foundation",
    "objc2-core-graphics",
    # Video view (task M4): the NSView subclass, its events, drag and drop,
    # and the key monitor's block.
    "NSDragging",
    "NSGraphics",
    "NSResponder",
    "NSTrackingArea",
    "NSView",
    "NSWindow",
    "block2",
    "objc2-quartz-core",
] }
# TCC permission probes and requests (task M11); `plans/06-CRATES-AND-LICENSES.md`.
objc2-core-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "CFArray",
    "CFCGTypes",
    # The AV1 `av1C` record in the decoder's format description (task M3).
    "CFData",
    "CFDictionary",
    "CFNumber",
    "CFString",
    # Shortcut event tap (task M6): the tap's port, its run-loop source and
    # the bounded `CFRunLoopRunInMode` (which takes a `CFTimeInterval`).
    "CFDate",
    "CFMachPort",
    "CFRunLoop",
] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = [
    "std",
    "CGBitmapContext",
    "CGColorSpace",
    "CGContext",
    "CGDirectDisplay",
    "CGDisplayConfiguration",
    "CGDisplayStream",
    "CGError",
    "CGEvent",
    # Input injection (task M5): event creation, its source and key codes.
    # `CGEventTypes` also gives the shortcut tap (task M6) its masks and flags.
    "CGEventSource",
    "CGEventTypes",
    "CGRemoteOperation",
    "CGGeometry",
    "CGImage",
    "CGWindow",
    "libc",
] }
# `focus_window_at` (task M5) adds the AX error codes and pid-taking calls.
objc2-application-services = { version = "0.3.2", default-features = false, features = [
    "std",
    "HIServices",
    "AXError",
    "AXUIElement",
    "libc",
] }
# Keychain (generic passwords). keyring 4.2 has no `macos` feature: the Keychain
# store is selected by its default `v1` feature on macOS.
keyring = "4.2"
uuid.workspace = true
# ScreenCaptureKit capture (task M1). Only the stream API: the defaults also
# pull in AVFoundation (recording output) and the content-sharing picker.
objc2-core-media = { version = "0.3.2", default-features = false, features = [
    "std",
    "CMSampleBuffer",
    "CMTime",
    "objc2-core-video",
    # Encoded samples and their parameter sets: the encoder's output (task
    # M2), and the decoder's format descriptions and compressed samples (task
    # M3).
    "CMBase",
    "CMBlockBuffer",
    "CMFormatDescription",
] }
# VideoToolbox encode (task M2) and decode (task M3);
# `plans/06-CRATES-AND-LICENSES.md`. Only the compression and decompression
# sessions, their properties and errors; the defaults also pull in the frame
# processors, RAW and multi-pass APIs.
objc2-video-toolbox = { version = "0.3.2", default-features = false, features = [
    "std",
    "VTBase",
    "VTCompressionProperties",
    "VTCompressionSession",
    "VTDecompressionProperties",
    "VTDecompressionSession",
    "VTErrors",
    "VTPixelTransferProperties",
    "VTSession",
    "VTUtilities",
    "objc2-core-media",
    "objc2-core-video",
] }
objc2-core-video = { version = "0.3.2", default-features = false, features = [
    "std",
    "CVBase",
    "CVBuffer",
    "CVImageBuffer",
    "CVPixelBuffer",
    # CPU frames into IOSurface buffers for the encoder (task M2).
    "CVPixelBufferPool",
    # Zero-copy present (task M4): CVPixelBuffer planes → MTLTexture.
    "CVMetalTexture",
    "CVMetalTextureCache",
    "CVReturn",
    "objc2",
    "objc2-metal",
] }
# Video surface + presenter (task M4): the shared shader/geometry/input logic,
# wgpu on Metal, Core Animation for the layer, Metal types for the import.
surface-wgpu = { path = "../surface-wgpu" }
wgpu = { version = "30", default-features = false, features = ["std", "wgsl", "metal"] }
pollster = "0.4"
objc2-quartz-core = { version = "0.3.2", default-features = false, features = [
    "std",
    "CALayer",
    "CAMediaTiming",
    "CAMetalLayer",
    "CATransaction",
    "objc2-core-foundation",
] }
objc2-metal = { version = "0.3.2", default-features = false, features = [
    "std",
    "MTLDevice",
    "MTLPixelFormat",
    "MTLResource",
    "MTLTexture",
] }
objc2-screen-capture-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "SCError",
    "SCShareableContent",
    "SCStream",
    "block2",
    "dispatch2",
    "objc2-core-foundation",
    "objc2-core-graphics",
    "objc2-core-media",
] }

# The device smoke test (tests/sck_smoke.rs) logs through tracing and measures
# process CPU time with getrusage.
[target.'cfg(target_os = "macos")'.dev-dependencies]
tracing-subscriber.workspace = true
libc = "0.2"
