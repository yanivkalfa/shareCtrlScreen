[package]
name = "platform-macos"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

# macOS implementation of `platform-api` (plan lane M). Empty on other targets.
[target.'cfg(target_os = "macos")'.dependencies]
platform-api = { path = "../platform-api" }
tracing.workspace = true
dirs = "6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSString", "NSURL"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSPasteboard", "NSWorkspace"] }
# TCC permission probes and requests (task M11); `plans/06-CRATES-AND-LICENSES.md`.
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFDictionary", "CFNumber", "CFString"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGEvent", "CGWindow"] }
objc2-application-services = { version = "0.3", default-features = false, features = ["std", "HIServices", "AXUIElement"] }
# Keychain (generic passwords). keyring 4.2 has no `macos` feature: the Keychain
# store is selected by its default `v1` feature on macOS.
keyring = "4.2"
uuid.workspace = true
