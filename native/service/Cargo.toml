[package]
name = "service"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "sharectrl-service"
path = "src/main.rs"

[lints]
workspace = true

# build.rs: link the VC runtime statically (no VCRUNTIME140.dll needed on the
# target machine). Same crate and version tauri-build uses for the app.
[build-dependencies]
static_vcruntime = "3.0"

[dependencies]
elevation = { path = "../crates/elevation" }
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(windows)'.dependencies]
# AUTOSTART_FLAG: the host the service launches is the sign-in instance.
platform-api = { path = "../crates/platform-api" }

[target.'cfg(windows)'.dependencies.windows]
workspace = true
features = [
    "Win32_Foundation",
    # WTSSESSION_NOTIFICATION, read in the control handler (U2).
    "Win32_System_RemoteDesktop",
    "Win32_System_Services",
    "Win32_System_Threading",
]

# Test builds only: the WTS_* session-event constants, to check the plain
# values in `events.rs` against the Windows headers.
[target.'cfg(windows)'.dev-dependencies.windows]
workspace = true
features = ["Win32_UI_WindowsAndMessaging"]
